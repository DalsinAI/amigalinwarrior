<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- LinWarrior GlowIcon art: a walking mech on a green hillside under a
       dusk sky, its arm cannon firing a red bolt, a city skyline behind.
       The AmiCradle Team's own. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a5e"/><stop offset="0.6" stop-color="#c8643c"/><stop offset="1" stop-color="#f2b25a"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa83c"/><stop offset="1" stop-color="#25501a"/>
    </linearGradient>
    <linearGradient id="armour" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8dde4"/><stop offset="1" stop-color="#6a7380"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="14" fill="url(#sky)" stroke="#000" stroke-width="3"/>
  <!-- skyline -->
  <g fill="#2a2440">
    <rect x="10" y="60" width="9" height="30"/><rect x="21" y="52" width="7" height="38"/>
    <rect x="30" y="64" width="10" height="26"/><rect x="92" y="56" width="8" height="34"/>
    <rect x="102" y="48" width="10" height="42"/><rect x="113" y="62" width="7" height="28"/>
  </g>
  <g fill="#ffd36a"><rect x="23" y="56" width="2" height="2"/><rect x="23" y="62" width="2" height="2"/>
    <rect x="105" y="52" width="2" height="2"/><rect x="105" y="60" width="2" height="2"/><rect x="94" y="62" width="2" height="2"/></g>
  <path d="M5 98 Q 40 80 70 92 T 123 86 L 123 110 Q 123 123 110 123 L 18 123 Q 5 123 5 110 Z" fill="url(#hill)" stroke="#000" stroke-width="1.5"/>
  <!-- the mech -->
  <g stroke="#000" stroke-width="1.6" stroke-linejoin="round">
    <path d="M52 76 L46 96 L40 100 L50 102 L56 84 Z" fill="url(#armour)"/>
    <path d="M70 76 L78 94 L74 102 L86 102 L84 92 L76 74 Z" fill="url(#armour)"/>
    <path d="M44 48 L82 46 L88 62 L78 78 L50 80 L40 64 Z" fill="url(#armour)"/>
    <rect x="54" y="52" width="18" height="7" rx="2" fill="#3fd0ff"/>
    <path d="M82 58 L104 54 L105 62 L84 66 Z" fill="#8a929e"/>
    <path d="M42 58 L30 66 L34 70 L46 64 Z" fill="#8a929e"/>
  </g>
  <path d="M106 58 L120 56" stroke="#ff3020" stroke-width="3" stroke-linecap="round"/>
  <circle cx="106" cy="58" r="3" fill="#ffe08a"/>
</svg>
